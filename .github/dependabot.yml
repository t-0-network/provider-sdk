# Dependency-update policy (see docs/DEPENDENCY_UPDATES.md):
#   * ONE weekly PR ("ci-batch") for every dependency, across all five
#     ecosystems, the starters and CI, except .github/tools/sumtool and
#     cross_test/go_helper, which are not watched and are updated by hand, and the
#     Python starter's floors, which are customer-facing and changed by hand
#     (python/CLAUDE.md).
#   * Every entry uses `patterns: ["*"]`. In a multi-ecosystem group Dependabot
#     updates only what matches the group's patterns and never opens a pull
#     request for anything else (dependabot-core,
#     updater/lib/dependabot/updater/operations/group_update_all_versions.rb:
#     `run_ungrouped_dependency_updates unless job.multi_ecosystem_update?`).
#     An allowlist therefore drops every dependency it does not name.
#   * Signing-path libraries arrive in the same batch. When the batch moves one,
#     its audit (docs/DEPENDENCY_UPDATES.md, "Updating a signing-path
#     dependency") is done in that pull request, or the library is held back with
#     `@dependabot ignore <name> <version>` and updated on its own:
#       golang.org/x/crypto, golang.org/x/net, connectrpc.com/connect,
#       github.com/btcsuite/*, github.com/decred/*,
#       @noble/*, @connectrpc/connect, @connectrpc/connect-node,
#       coincurve, pycryptodome,
#       org.bouncycastle:*, BouncyCastle.Cryptography
#     @connectrpc/connect and @connectrpc/connect-node are pinned exactly in
#     node/sdk/package.json and must move together (connect-node peer-depends on
#     connect's exact version).
version: 2

multi-ecosystem-groups:
  ci-batch:
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Berlin"
    labels: ["dependencies"]
    commit-message:
      prefix: "chore(deps)"

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    multi-ecosystem-group: "ci-batch"
    patterns: ["*"]
    cooldown:
      default-days: 3

  # cross_test/go_helper is not listed: its go.work also uses ../../go, and how Dependabot
  # treats a workspace is unclear. Its versions follow /go by hand.
  - package-ecosystem: "gomod"
    directories:
      - "/go"
      - "/go/starter/template"
      - "/cli"
    multi-ecosystem-group: "ci-batch"
    patterns: ["*"]
    cooldown:
      default-days: 3
    ignore:
      - dependency-name: "github.com/t-0-network/provider-sdk/go"   # release.yaml owns the template pin

  - package-ecosystem: "npm"
    directories:
      - "/node/sdk"
      - "/node/starter/template"      # no lockfile: only out-of-range bumps surface
    multi-ecosystem-group: "ci-batch"
    patterns: ["*"]
    cooldown:
      default-days: 3
    ignore:
      - dependency-name: "@t-0/provider-sdk"                       # release.yaml owns it

  - package-ecosystem: "uv"                                        # was "pip": pip never moved uv.lock
    directory: "/python"
    multi-ecosystem-group: "ci-batch"
    patterns: ["*"]
    cooldown:
      default-days: 3

  # /java includes the starter's build (settings.gradle.kts), but not its own Gradle wrapper,
  # so the starter is listed as well.
  - package-ecosystem: "gradle"
    directories:
      - "/java"
      - "/java/starter/template"
    multi-ecosystem-group: "ci-batch"
    patterns: ["*"]
    cooldown:
      default-days: 3
    ignore:
      - dependency-name: "network.t-0:provider-sdk-java"           # template, release-owned
      - dependency-name: "com.github.t-0-network:provider-sdk"

  # csharp.slnx holds only the SDK and its tests, so the starter is listed on its own.
  - package-ecosystem: "nuget"
    directories:
      - "/csharp"
      - "/csharp/starter/template"
    multi-ecosystem-group: "ci-batch"
    patterns: ["*"]
    cooldown:
      default-days: 3
    ignore:
      - dependency-name: "T0.ProviderSdk"                          # template, release-owned
