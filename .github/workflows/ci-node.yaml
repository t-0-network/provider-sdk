name: CI / Node

on:
  push:
    branches: [master]
    paths:
      - "node/**"
      - "go/**"
      - "proto/**"
      - "cross_test/**"
      - ".github/actions/setup-go-helper/**"
      - ".github/actions/test-node/**"
      - ".github/workflows/ci-node.yaml"
  pull_request:
    branches: [master]
    paths:
      - "node/**"
      - "go/**"
      - "proto/**"
      - "cross_test/**"
      - ".github/actions/setup-go-helper/**"
      - ".github/actions/test-node/**"
      - ".github/workflows/ci-node.yaml"
  # Weekly, so node-latest-deps sees a new dependency release even when nobody
  # touches the SDK.
  schedule:
    - cron: "0 6 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    name: Node
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          show-progress: false

      - uses: ./.github/actions/test-node

      # Test the starter template against the freshly built SDK.
      # The template has no lockfile (industry standard for scaffold
      # tools — the unified CLI prints `npm install` as the next step).
      # We pack the local SDK and install it directly so the template
      # always tests against unreleased SDK changes, and CI works even
      # on release commits where the new version isn't published to npm
      # yet. --no-save and --package-lock=false keep test-only file
      # paths out of the release-managed manifest and template.
      - name: Pack SDK for template test
        working-directory: node/sdk
        run: npm pack

      - name: Install template deps with local SDK
        working-directory: node/starter/template
        run: npm install --no-save --package-lock=false --no-audit --no-fund ../../sdk/t-0-provider-sdk-*.tgz

      - name: Test starter template against local SDK
        working-directory: node/starter/template
        run: npm test

  # Customers install the SDK without our lockfile: npm does not publish
  # package-lock.json, so their install takes the newest release in every range,
  # and every transitive dependency floats too. The job above only ever tests
  # package-lock.json, which is how a dependency release can break customers
  # before CI sees it (connectrpc 0.11 broke every Python request for months,
  # #298). This job drops the lockfile, installs the way a fresh
  # `npm install @t-0/provider-sdk` would, and runs the full suite on that.
  # devDependencies float here too; a failure from them is ours to fix but does
  # not reach customers.
  node-latest-deps:
    name: Node (unlocked latest deps)
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          show-progress: false

      # No npm cache: its key is the lockfile, which this job deletes.
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: lts/*

      - uses: ./.github/actions/setup-go-helper

      - name: Install latest dependencies without the lockfile
        working-directory: node/sdk
        run: |
          rm package-lock.json
          npm install --no-audit --no-fund

      - name: Show resolved versions
        working-directory: node/sdk
        run: npm ls --omit=dev --all

      - name: Build
        working-directory: node/sdk
        run: npm run build

      - name: Run SDK tests against latest dependencies
        working-directory: node/sdk
        run: npm test
