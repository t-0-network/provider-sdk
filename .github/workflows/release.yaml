name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump type"
        required: true
        default: "patch"
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write

jobs:
  # --- Validate all builds + tests before releasing ---
  build-go:
    name: Build Go
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          show-progress: false

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: "stable"
          cache-dependency-path: go/go.sum

      - name: Build and test
        working-directory: go
        run: |
          go vet ./...
          go test ./...

  build-node:
    name: Test Node
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          show-progress: false

      - uses: ./.github/actions/test-node

  build-java:
    name: Test Java
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          show-progress: false

      - uses: ./.github/actions/test-java

  build-python:
    name: Test Python
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          show-progress: false

      - uses: ./.github/actions/test-python

  build-csharp:
    name: Test C#
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          show-progress: false

      - uses: ./.github/actions/test-csharp

  build-cli:
    name: Build CLI
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          show-progress: false

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: "stable"
          cache-dependency-path: cli/go.sum

      - name: Sync templates and build
        working-directory: cli
        run: |
          go generate ./...
          go build ./...
          go test ./...

  # --- Release (only after all builds pass) ---
  release:
    name: Create Release
    needs: [build-go, build-node, build-java, build-python, build-csharp, build-cli]
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - name: Generate GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.CI_APP_CLIENT_ID }}
          private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: provider-sdk

      - name: Checkout
        uses: actions/checkout@v7
        with:
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: "stable"
          cache: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: lts/*

      - name: Calculate version
        id: version
        run: |
          # Latest vX.Y.Z release tag (default v1.1.0 if none). --match restricts to semver
          # release tags so the go/* module tags — which sit on the same commits — are never
          # picked, which would otherwise yield a garbage version like "go/.../v1.2.3".
          LATEST_TAG=$(git describe --tags --abbrev=0 --match 'v[0-9]*.[0-9]*.[0-9]*' 2>/dev/null || echo "v1.1.0")
          CURRENT="${LATEST_TAG#v}"
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"

          case "${{ inputs.bump }}" in
            major)
              MAJOR=$((MAJOR + 1))
              MINOR=0
              PATCH=0
              ;;
            minor)
              MINOR=$((MINOR + 1))
              PATCH=0
              ;;
            patch)
              PATCH=$((PATCH + 1))
              ;;
          esac

          VERSION="${MAJOR}.${MINOR}.${PATCH}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Release version: ${VERSION}"

      # --- Update version in all language files ---
      - name: Update TS SDK version
        run: |
          cd node/sdk
          npm version ${{ steps.version.outputs.version }} --no-git-tag-version

      - name: Update TS Starter version
        run: |
          cd node/starter
          npm version ${{ steps.version.outputs.version }} --no-git-tag-version

      - name: Update Python versions
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          sed -i "s/^version = \".*\"/version = \"${VERSION}\"/" python/sdk/pyproject.toml
          sed -i "s/^version = \".*\"/version = \"${VERSION}\"/" python/starter/pyproject.toml

      - name: Update Java version
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          sed -i "s/^version=.*/version=${VERSION}/" java/gradle.properties

      - name: Update C# versions
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          sed -i "s|<Version>.*</Version>|<Version>${VERSION}</Version>|" csharp/sdk/T0.ProviderSdk/T0.ProviderSdk.csproj
          sed -i "s|<Version>.*</Version>|<Version>${VERSION}</Version>|" csharp/starter/T0.ProviderStarter/T0.ProviderStarter.csproj

      # --- Update SDK runtime version constants (they feed the health registry's t0: key) ---
      - name: Update SDK runtime version constants
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          # Go
          sed -i "s/const Version = \".*\"/const Version = \"${VERSION}\"/" go/sdkversion/version.go
          # Node
          sed -i "s/export const SDK_VERSION = \".*\"/export const SDK_VERSION = \"${VERSION}\"/" node/sdk/src/version.ts
          # Python
          sed -i "s/^__version__ = \".*\"/__version__ = \"${VERSION}\"/" python/sdk/src/t0_provider_sdk/_version.py
          # Java
          sed -i "s/^sdk\.version=.*/sdk.version=${VERSION}/" java/sdk/src/main/resources/META-INF/sdk-version.properties

      # --- Update SDK version in starter templates ---
      - name: Update TS Starter template SDK version
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          cd node/starter/template
          jq --arg v "^${VERSION}" '.dependencies["@t-0/provider-sdk"] = $v' package.json > package.json.tmp
          mv package.json.tmp package.json

      - name: Update C# Starter template SDK version
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          sed -i "s|T0.ProviderSdk\" Version=\"[^\"]*\"|T0.ProviderSdk\" Version=\"${VERSION}\"|" csharp/starter/template/my-provider.csproj

      # How this works and why it must stay above "Commit version bump":
      # docs/RELEASE_AND_PUBLISH.md, step 4.
      - name: Update Go Starter template SDK version
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          PROXY_DIR="${RUNNER_TEMP}/goproxy"
          # sumtool walks the filesystem; the tag will only carry tracked files.
          test -z "$(git status --porcelain --ignored -- go | grep -E '^(\?\?|!!)')" \
            || { echo "::error::untracked/ignored files under go/ would poison the module hash"; exit 1; }
          GOPROXY=direct go -C .github/tools/sumtool run . "${GITHUB_WORKSPACE}/go" "v${VERSION}" "${PROXY_DIR}"
          cd go/starter/template
          go mod edit -require "github.com/t-0-network/provider-sdk/go@v${VERSION}"
          export GOPROXY="file://${PROXY_DIR},direct"
          export GONOSUMDB="github.com/t-0-network"
          go mod tidy
          go build ./...

      # --- Validate version updates ---
      - name: Validate updated files
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          ERRORS=0

          # Validate Node SDK version
          NODE_SDK_VER=$(node -p "require('./node/sdk/package.json').version")
          if [ "$NODE_SDK_VER" != "$VERSION" ]; then
            echo "::error::Node SDK version mismatch: expected $VERSION, got $NODE_SDK_VER"
            ERRORS=$((ERRORS + 1))
          fi

          # Validate Node Starter version
          NODE_STARTER_VER=$(node -p "require('./node/starter/package.json').version")
          if [ "$NODE_STARTER_VER" != "$VERSION" ]; then
            echo "::error::Node Starter version mismatch: expected $VERSION, got $NODE_STARTER_VER"
            ERRORS=$((ERRORS + 1))
          fi

          # Validate Python SDK version
          PY_SDK_VER=$(grep '^version = ' python/sdk/pyproject.toml | head -1 | sed 's/version = "\(.*\)"/\1/')
          if [ "$PY_SDK_VER" != "$VERSION" ]; then
            echo "::error::Python SDK version mismatch: expected $VERSION, got $PY_SDK_VER"
            ERRORS=$((ERRORS + 1))
          fi

          # Validate Python Starter version
          PY_STARTER_VER=$(grep '^version = ' python/starter/pyproject.toml | head -1 | sed 's/version = "\(.*\)"/\1/')
          if [ "$PY_STARTER_VER" != "$VERSION" ]; then
            echo "::error::Python Starter version mismatch: expected $VERSION, got $PY_STARTER_VER"
            ERRORS=$((ERRORS + 1))
          fi

          # Validate Java version
          JAVA_VER=$(grep '^version=' java/gradle.properties | cut -d= -f2)
          if [ "$JAVA_VER" != "$VERSION" ]; then
            echo "::error::Java version mismatch: expected $VERSION, got $JAVA_VER"
            ERRORS=$((ERRORS + 1))
          fi

          # Validate TS Starter template SDK dependency
          TEMPLATE_SDK_VER=$(node -p "require('./node/starter/template/package.json').dependencies['@t-0/provider-sdk']")
          if [ "$TEMPLATE_SDK_VER" != "^$VERSION" ]; then
            echo "::error::TS Starter template SDK version mismatch: expected ^$VERSION, got $TEMPLATE_SDK_VER"
            ERRORS=$((ERRORS + 1))
          fi

          # Validate Go Starter template SDK dependency
          GO_TEMPLATE_VER=$(grep 'github.com/t-0-network/provider-sdk/go v' go/starter/template/go.mod | awk '{print $2}')
          if [ "$GO_TEMPLATE_VER" != "v$VERSION" ]; then
            echo "::error::Go Starter template SDK version mismatch: expected v$VERSION, got $GO_TEMPLATE_VER"
            ERRORS=$((ERRORS + 1))
          fi

          # Validate C# SDK version
          CSHARP_SDK_VER=$(grep '<Version>' csharp/sdk/T0.ProviderSdk/T0.ProviderSdk.csproj | sed 's/.*<Version>\(.*\)<\/Version>.*/\1/')
          if [ "$CSHARP_SDK_VER" != "$VERSION" ]; then
            echo "::error::C# SDK version mismatch: expected $VERSION, got $CSHARP_SDK_VER"
            ERRORS=$((ERRORS + 1))
          fi

          # Validate C# Starter version
          CSHARP_STARTER_VER=$(grep '<Version>' csharp/starter/T0.ProviderStarter/T0.ProviderStarter.csproj | sed 's/.*<Version>\(.*\)<\/Version>.*/\1/')
          if [ "$CSHARP_STARTER_VER" != "$VERSION" ]; then
            echo "::error::C# Starter version mismatch: expected $VERSION, got $CSHARP_STARTER_VER"
            ERRORS=$((ERRORS + 1))
          fi

          # Validate C# extracted template SDK version (unified CLI)
          CSHARP_TMPL_VER=$(grep 'T0.ProviderSdk' csharp/starter/template/my-provider.csproj | sed 's/.*Version="\([^"]*\)".*/\1/')
          if [ "$CSHARP_TMPL_VER" != "$VERSION" ]; then
            echo "::error::C# template csproj SDK version mismatch: expected $VERSION, got $CSHARP_TMPL_VER"
            ERRORS=$((ERRORS + 1))
          fi

          # Validate Go SDK runtime version constant (feeds the health registry's t0: key)
          GO_RUNTIME_VER=$(grep 'const Version = ' go/sdkversion/version.go | sed 's/.*"\(.*\)".*/\1/')
          if [ "$GO_RUNTIME_VER" != "$VERSION" ]; then
            echo "::error::Go SDK runtime version mismatch: expected $VERSION, got $GO_RUNTIME_VER"
            ERRORS=$((ERRORS + 1))
          fi

          # Validate Node SDK runtime version constant
          NODE_RUNTIME_VER=$(grep 'export const SDK_VERSION = ' node/sdk/src/version.ts | sed 's/.*"\(.*\)".*/\1/')
          if [ "$NODE_RUNTIME_VER" != "$VERSION" ]; then
            echo "::error::Node SDK runtime version mismatch: expected $VERSION, got $NODE_RUNTIME_VER"
            ERRORS=$((ERRORS + 1))
          fi

          # Validate Python SDK runtime version constant
          PY_RUNTIME_VER=$(grep '^__version__ = ' python/sdk/src/t0_provider_sdk/_version.py | sed 's/.*"\(.*\)".*/\1/')
          if [ "$PY_RUNTIME_VER" != "$VERSION" ]; then
            echo "::error::Python SDK runtime version mismatch: expected $VERSION, got $PY_RUNTIME_VER"
            ERRORS=$((ERRORS + 1))
          fi

          # Validate Java SDK runtime version constant
          JAVA_RUNTIME_VER=$(grep '^sdk.version=' java/sdk/src/main/resources/META-INF/sdk-version.properties | cut -d= -f2)
          if [ "$JAVA_RUNTIME_VER" != "$VERSION" ]; then
            echo "::error::Java SDK runtime version mismatch: expected $VERSION, got $JAVA_RUNTIME_VER"
            ERRORS=$((ERRORS + 1))
          fi

          if [ $ERRORS -gt 0 ]; then
            echo "::error::$ERRORS version validation(s) failed"
            exit 1
          fi
          echo "All version validations passed for $VERSION"

      # --- Commit, tag, and release ---
      # git-auto-commit-action commits the version bump and pushes the v<version> tag (as the
      # github-actions bot — it sets its own identity), which triggers publish.yaml. We then
      # create the GitHub Release for that tag with `gh` + the App token — NOT the default
      # GITHUB_TOKEN, which the releases API rejects with HTTP 401.
      #
      # The go/* Go module tags are NOT created here. They live in publish.yaml's "Publish Go"
      # job, created right before it warms the Go proxy — so the proxy is never asked to resolve
      # a version before its tag exists.
      - name: Commit version bump
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "Release ${{ steps.version.outputs.version }}"
          tagging_message: "v${{ steps.version.outputs.version }}"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          gh release create "v${{ steps.version.outputs.version }}" \
            --verify-tag \
            --title "${{ steps.version.outputs.version }}" \
            --notes "Release ${{ steps.version.outputs.version }}"
