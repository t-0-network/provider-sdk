name: CI / Python

on:
  push:
    branches: [master]
    paths:
      - "python/**"
      - "go/**"
      - "proto/**"
      - "buf.yaml"
      - "buf.lock"
      - "buf.gen.yaml"
      - ".github/actions/buf-generate/**"
      - "scripts/buf-generate.sh"
      - "cross_test/**"
      - ".github/actions/setup-go-helper/**"
      - ".github/actions/test-python/**"
      - ".github/workflows/ci-python.yaml"
  pull_request:
    branches: [master]
    paths:
      - "python/**"
      - "go/**"
      - "proto/**"
      - "buf.yaml"
      - "buf.lock"
      - "buf.gen.yaml"
      - ".github/actions/buf-generate/**"
      - "scripts/buf-generate.sh"
      - "cross_test/**"
      - ".github/actions/setup-go-helper/**"
      - ".github/actions/test-python/**"
      - ".github/workflows/ci-python.yaml"
  # Nightly, so python-latest-deps sees a new dependency release even when nobody
  # touches the SDK.
  schedule:
    - cron: "0 3 * * *"

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          show-progress: false

      - uses: ./.github/actions/test-python

      # The template is not a workspace member, so it runs as a generated project
      # would, from a copy. `uv add <wheel>` makes it use the SDK wheel built above
      # from this tree instead of the one on PyPI.
      - name: Test starter template against this tree's SDK
        working-directory: python
        run: |
          wheel=$(ls "$PWD"/dist/t0_provider_sdk-*.whl)
          cp -r starter/template "$RUNNER_TEMP/starter"
          cd "$RUNNER_TEMP/starter"
          uv add --no-sync "$wheel" -q
          uv run pytest

      - name: Lint
        working-directory: python
        run: uv run ruff check .

      - name: Format check
        working-directory: python
        run: uv run ruff format --check .

  # Customers install the SDK without our lockfile, so their resolver picks the
  # newest release of every open-ranged dependency. The job above only ever
  # tests uv.lock, which is how connectrpc 0.11 broke every request for months
  # before a client reported it. This job installs the built wheel exactly the
  # way a fresh `pip install t0-provider-sdk` would and runs the suite on that.
  python-latest-deps:
    name: Python (unlocked latest deps)
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          show-progress: false

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - uses: ./.github/actions/buf-generate

      - name: Build SDK wheel
        working-directory: python
        run: uv build --package t0-provider-sdk

      - name: Install wheel with latest resolvable dependencies
        working-directory: python
        run: |
          uv venv --python 3.13 .venv-latest
          uv pip install --python .venv-latest/bin/python --resolution highest \
            dist/t0_provider_sdk-*.whl pytest pytest-asyncio uvicorn

      - name: Show resolved versions
        working-directory: python
        run: uv pip list --python .venv-latest/bin/python

      - name: Run SDK tests against latest dependencies
        working-directory: python/sdk
        run: ../.venv-latest/bin/python -m pytest tests -p no:cacheprovider
