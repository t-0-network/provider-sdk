name: CI / Python

on:
  # Upstream breaks on PyPI's schedule, not ours: run the unlocked job daily so
  # a breaking release is caught the next morning instead of by a customer.
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - "python/**"
      - "proto/**"
      - "cross_test/**"
      - ".github/workflows/ci-python.yaml"
  pull_request:
    branches: [master]
    paths:
      - "python/**"
      - "proto/**"
      - "cross_test/**"
      - ".github/workflows/ci-python.yaml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python
    # The lockfile does not change between commits; only the unlocked job is
    # worth re-running on the timer.
    if: github.event_name != 'schedule'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          show-progress: false

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: python/uv.lock

      - name: Install dependencies
        working-directory: python
        run: uv sync --all-packages

      - name: Build packages
        working-directory: python
        run: |
          uv build --package t0-provider-sdk
          uv build --package t0-provider-starter

      - name: Lint
        working-directory: python
        run: uv run ruff check .

      - name: Format check
        working-directory: python
        run: uv run ruff format --check .

      # TODO: re-enable once type errors are fixed
      # - name: Type check
      #   working-directory: python
      #   run: uv run mypy .

      - name: Run tests
        working-directory: python
        run: uv run pytest

  # Customers install the SDK without our lockfile, so their resolver picks the
  # newest release of every open-ranged dependency. The job above only ever
  # tests uv.lock, which is how connectrpc 0.11 broke every request for months
  # before a client reported it. This job installs the built wheel exactly the
  # way a fresh `pip install t0-provider-sdk` would and runs the suite on that.
  python-latest-deps:
    name: Python (unlocked latest deps)
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          show-progress: false

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Build SDK wheel
        working-directory: python
        run: uv build --package t0-provider-sdk

      - name: Install wheel with latest resolvable dependencies
        working-directory: python
        run: |
          uv venv --python 3.13 .venv-latest
          uv pip install --python .venv-latest/bin/python --resolution highest \
            dist/t0_provider_sdk-*.whl pytest pytest-asyncio uvicorn

      - name: Show resolved versions
        working-directory: python
        run: uv pip list --python .venv-latest/bin/python

      - name: Run SDK tests against latest dependencies
        working-directory: python/sdk
        run: ../.venv-latest/bin/python -m pytest tests -p no:cacheprovider

      # A red scheduled run only emails whoever last edited this file. Open an
      # issue instead (one at a time) so the break is visible to the team.
      - name: Open issue on scheduled failure
        if: failure() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh label create latest-deps --force \
            --description "Python SDK broke against the newest PyPI dependencies" \
            --color D93F0B
          open_count=$(gh issue list --label latest-deps --state open --json number --jq 'length')
          if [ "$open_count" = "0" ]; then
            gh issue create --label latest-deps \
              --title "Python SDK fails against latest PyPI dependencies" \
              --body "The scheduled unlocked-dependencies run failed: $RUN_URL

          The \"Show resolved versions\" step in that run lists what PyPI served. Compare it with python/uv.lock to find the release that broke the SDK, then follow .claude/skills/dependency-update/SKILL.md."
          else
            gh issue comment "$(gh issue list --label latest-deps --state open --json number --jq '.[0].number')" \
              --body "Still failing: $RUN_URL"
          fi
