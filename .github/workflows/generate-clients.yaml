name: Generate Clients

on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - "proto/**"

jobs:
  generate:
    runs-on: blacksmith-4vcpu-ubuntu-2404

    # Trigger only if the PR is opened or synchronized by T-0 CI APP (sync proto files)
    if: github.event.pull_request.user.login == 't-0-ci[bot]'

    steps:
      - name: Generate GitHub APP Token
        uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ vars.CI_APP_CLIENT_ID }}
          private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: provider-sdk

      - name: Checkout
        uses: actions/checkout@v7
        with:
          show-progress: false
          token: ${{ steps.app-token.outputs.token }}
          ref: ${{ github.head_ref }}

      - name: Setup buf
        uses: bufbuild/buf-setup-action@v1

      # The Python connect plugin runs locally via `uv run` (see buf.gen.yaml):
      # connectrpc >= 0.11 rewrote protoc-gen-connectrpc in Python and the BSR
      # remote plugin stops at v0.10.1.
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Setup uv
        uses: astral-sh/setup-uv@v7

      - name: Install Python codegen plugin
        run: uv sync --project python --all-packages

      # Generate Go, Node, Python, C# from root buf.gen.yaml
      - name: Generate clients
        run: buf generate

      - name: Commit generated files
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "Auto-generate gRPC clients"
          file_pattern: "go/api/** node/sdk/src/common/gen/** python/sdk/src/t0_provider_sdk/api/** csharp/sdk/T0.ProviderSdk/Api/**"
