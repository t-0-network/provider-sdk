name: CI / Unified CLI

on:
  push:
    branches: [master]
    paths:
      - "cli/**"
      - "go/starter/template/**"
      - "node/starter/template/**"
      - "node/sdk/**"
      - "python/starter/src/t0_provider_starter/template/**"
      - "java/starter/template/**"
      - "csharp/starter/template/**"
      - ".github/workflows/ci-cli.yaml"
  pull_request:
    branches: [master]
    paths:
      - "cli/**"
      - "go/starter/template/**"
      - "node/starter/template/**"
      - "node/sdk/**"
      - "python/starter/src/t0_provider_starter/template/**"
      - "java/starter/template/**"
      - "csharp/starter/template/**"
      - ".github/workflows/ci-cli.yaml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cli:
    name: Build & Scaffold Test
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          show-progress: false

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.sum

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: lts/*

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Sync templates (go generate)
        working-directory: cli
        run: go generate ./...

      # Version only feeds the Java template's SDK pin and `--version`; 0.0.0-local
      # is the version the Java SDK is published under below, so the Java scaffold
      # resolves the SDK built from this tree.
      - name: Build CLI
        working-directory: cli
        run: go build -ldflags "-X main.Version=0.0.0-local" -o ../t0-init .

      - name: Run tests
        working-directory: cli
        run: go test -v ./...

      - name: Pack Node SDK for scaffold test
        working-directory: node/sdk
        run: |
          npm ci
          npm run build
          npm pack

      # --- Scaffold all 5 ecosystems ---
      - name: Scaffold Go project
        run: |
          ./t0-init init --lang=go --module=github.com/test/my-go-provider --no-color --dir=test-go my-go-provider
          test -f test-go/go.mod
          test -f test-go/.env
          test -f test-go/.gitignore
          grep 'PROVIDER_PRIVATE_KEY=0x' test-go/.env

      - name: Scaffold Node project
        run: |
          ./t0-init init --lang=node --no-color --dir=test-node my-node-provider
          test -f test-node/package.json
          test -f test-node/.env
          test -f test-node/.gitignore
          grep 'PROVIDER_PRIVATE_KEY=0x' test-node/.env

      - name: Scaffold Python project
        run: |
          ./t0-init init --lang=python --no-color --dir=test-python my-python-provider
          test -f test-python/pyproject.toml
          test -f test-python/.env
          test -f test-python/.gitignore
          grep 'PROVIDER_PRIVATE_KEY=0x' test-python/.env

      - name: Scaffold Java project
        run: |
          ./t0-init init --lang=java --repository=maven-central --no-color --dir=test-java my-java-provider
          grep '"network.t-0:provider-sdk-java:0.0.0-local"' test-java/build.gradle.kts
          test -f test-java/build.gradle.kts
          test -f test-java/.env
          test -f test-java/.gitignore
          test -x test-java/gradlew
          grep 'PROVIDER_PRIVATE_KEY=0x' test-java/.env
          grep 'my-java-provider' test-java/settings.gradle.kts

      - name: Scaffold C# project
        run: |
          ./t0-init init --lang=csharp --no-color --dir=test-csharp my-csharp-provider
          test -f test-csharp/my-csharp-provider.csproj
          test -f test-csharp/.env
          test -f test-csharp/.gitignore
          grep 'PROVIDER_PRIVATE_KEY=0x' test-csharp/.env

      # --- Compile-verify all 5 scaffolded projects ---
      - name: Verify Go scaffold compiles
        run: |
          VERSION=$(grep 'github.com/t-0-network/provider-sdk/go v' test-go/go.mod | awk '{print $2}')
          PROXY_DIR="${RUNNER_TEMP}/goproxy"
          go -C .github/tools/sumtool run . "${GITHUB_WORKSPACE}/go" "${VERSION}" "${PROXY_DIR}"
          cd test-go
          # In PRs the SDK source may differ from the published tag, producing a
          # different module hash.  Drop the stale go.sum entries and re-tidy so
          # Go fetches the locally-built archive without a checksum conflict.
          sed -i '/^github.com\/t-0-network\/provider-sdk\/go /d' go.sum
          export GOMODCACHE="${RUNNER_TEMP}/template-modcache"
          export GONOSUMDB="github.com/t-0-network"
          # Gate: file proxy only. A broken sumtool layout fails here locally instead of
          # silently falling through to the published SDK (or, pre-tag, poisoning
          # proxy.golang.org). Rationale: docs/RELEASE_AND_PUBLISH.md, "Precomputing".
          GOPROXY="file://${PROXY_DIR}" go mod download "github.com/t-0-network/provider-sdk/go@${VERSION}"
          export GOPROXY="file://${PROXY_DIR},https://proxy.golang.org,direct"
          go mod tidy
          go build ./...

      # Use the locally packed SDK so this also validates release commits before
      # the package is available from npm, without rewriting the template manifest or lockfile.
      - name: Verify Node scaffold builds and tests
        working-directory: test-node
        run: |
          npm install --silent --no-save --package-lock=false --no-audit --no-fund ../node/sdk/t-0-provider-sdk-*.tgz
          npm test

      # The scaffolds below are compiled against the SDKs built from this tree, not
      # the published ones: between an SDK change and the next release the published
      # package lags the template, and a release commit has no published package yet.
      # Each SDK is published to a local, disposable location under a version that
      # is not on any registry, so the scaffold cannot silently pick a registry copy.
      - name: Publish this tree's Java, Python and C# SDKs locally
        run: |
          set -euo pipefail
          (cd java && ./gradlew :sdk:publishToMavenLocal --no-daemon -q -Pversion=0.0.0-local -Dmaven.repo.local="${RUNNER_TEMP}/m2")
          test -d "${RUNNER_TEMP}/m2/network/t-0/provider-sdk-java/0.0.0-local"
          printf 'allprojects { repositories { mavenLocal() } }\n' > "${RUNNER_TEMP}/mavenlocal.init.gradle"
          (cd python && uv build --package t0-provider-sdk -o "${RUNNER_TEMP}/pydist" -q)
          ls "${RUNNER_TEMP}"/pydist/t0_provider_sdk-*.whl
          dotnet pack csharp/sdk/T0.ProviderSdk -c Release -p:Version=0.0.0-local -o "${RUNNER_TEMP}/nupkg" --nologo -v quiet
          ls "${RUNNER_TEMP}"/nupkg/T0.ProviderSdk.0.0.0-local.nupkg

      - name: Verify Java scaffold compiles against this tree's SDK
        working-directory: test-java
        run: ./gradlew compileJava --no-daemon -q --init-script "${RUNNER_TEMP}/mavenlocal.init.gradle" -Dmaven.repo.local="${RUNNER_TEMP}/m2"

      # `uv add <wheel>` turns the template's registry requirement into a path source,
      # so resolution cannot fall back to the index for the SDK itself.
      - name: Verify Python scaffold resolves and imports this tree's SDK
        working-directory: test-python
        run: |
          uv add --no-sync "${RUNNER_TEMP}"/pydist/t0_provider_sdk-*.whl -q
          uv sync -q
          uv run python -c "import t0_provider_sdk, importlib.metadata as m; print('t0-provider-sdk', m.version('t0-provider-sdk'))"

      # A nuget.config local to the scaffold: the packed SDK plus nuget.org for
      # everything else; the exact 0.0.0-local pin can only come from the local feed.
      - name: Verify C# scaffold compiles against this tree's SDK
        working-directory: test-csharp
        run: |
          dotnet new nugetconfig > /dev/null
          dotnet nuget add source "${RUNNER_TEMP}/nupkg" --name tree-sdk --configfile nuget.config > /dev/null
          dotnet add package T0.ProviderSdk --version 0.0.0-local > /dev/null
          grep 'Version="0.0.0-local"' my-csharp-provider.csproj
          dotnet build --nologo -v quiet

  cli-windows:
    name: Build & Test (Windows)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          show-progress: false

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.sum

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: lts/*

      - name: Sync templates (go generate)
        working-directory: cli
        run: go generate ./...

      - name: Build CLI
        working-directory: cli
        run: go build -ldflags "-X main.Version=dev" -o ../t0-init.exe .

      - name: Run tests
        working-directory: cli
        run: go test -v ./...

      - name: Scaffold Node project
        run: |
          ./t0-init.exe init --lang=node --no-color --dir=test-node my-node-provider
          if (!(Test-Path test-node/package.json)) { exit 1 }
          if (!(Test-Path test-node/.env)) { exit 1 }
          if (!(Test-Path test-node/.gitignore)) { exit 1 }
        shell: pwsh
