name: Publish

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  id-token: write
  contents: write

jobs:
  # --- Build gate (all must pass before any publishing) ---
  build-go:
    name: Build Go
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          show-progress: false

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: "stable"
          cache-dependency-path: go/go.sum

      - name: Build
        working-directory: go
        run: go build ./...

  build-node:
    name: Build Node
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          show-progress: false

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: node/sdk/package-lock.json

      - name: Build SDK
        working-directory: node/sdk
        run: |
          npm ci
          npm run build

      - name: Build Starter
        working-directory: node/starter
        run: |
          npm ci
          npm run build

  build-java:
    name: Build Java
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          show-progress: false

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true

      - name: Build
        working-directory: java
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon

  build-python:
    name: Build Python
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          show-progress: false

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: python/uv.lock

      - name: Build
        working-directory: python
        run: |
          uv sync
          uv build --package t0-provider-sdk
          uv build --package t0-provider-starter

  build-csharp:
    name: Build C#
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          show-progress: false

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Build
        working-directory: csharp
        run: dotnet build

  # --- Publish (only after ALL builds pass) ---
  publish-go:
    name: Publish Go
    needs: [build-go, build-node, build-java, build-python, build-csharp]
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - name: Generate GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.CI_APP_ID }}
          private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: provider-sdk

      - name: Checkout
        uses: actions/checkout@v6
        with:
          # App token so the `git push` of the module tags below is authenticated.
          token: ${{ steps.app-token.outputs.token }}
          show-progress: false

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: "stable"
          cache-dependency-path: go/go.sum

      - name: Verify SDK version matches tag
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          RUNTIME=$(grep 'const Version = ' go/sdkversion/version.go | sed 's/.*"\(.*\)".*/\1/')
          [ "$RUNTIME" = "$VERSION" ] || { echo "::error::go/sdkversion/version.go has $RUNTIME, tag is v$VERSION"; exit 1; }
          echo "Go SDK runtime version $RUNTIME matches tag v$VERSION"

      # Create the go/* module tags here, right before warming the proxy, so the proxy is never
      # asked to resolve a version before its tag exists (the gap that 404'd Go on 1.1.20, and
      # whose negative cache then lingered). Lightweight tags need no git identity; re-running
      # this job is safe — re-pushing an identical tag is a no-op.
      - name: Create and push Go module tags
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          git tag "go/v${VERSION}"
          git tag "go/starter/v${VERSION}"
          git tag "go/starter/template/v${VERSION}"
          git push origin "go/v${VERSION}" "go/starter/v${VERSION}" "go/starter/template/v${VERSION}"

      # A freshly pushed tag can take a moment to become visible to proxy.golang.org, so retry
      # each module a few times before failing.
      - name: Request GOPROXY update
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          warm() {
            for attempt in 1 2 3 4 5; do
              if GOPROXY=proxy.golang.org go list -m "$1@v${VERSION}"; then
                return 0
              fi
              echo "proxy not ready for $1@v${VERSION} (attempt ${attempt}/5); retrying in 10s..."
              sleep 10
            done
            echo "::error::proxy.golang.org did not serve $1@v${VERSION} after 5 attempts"
            return 1
          }
          warm "github.com/t-0-network/provider-sdk/go"
          warm "github.com/t-0-network/provider-sdk/go/starter"
          warm "github.com/t-0-network/provider-sdk/go/starter/template"

  publish-node-sdk:
    name: Publish Node SDK
    needs: [build-go, build-node, build-java, build-python, build-csharp]
    # Must use github-hosted runner: npm --provenance requires it (Blacksmith = "self-hosted", rejected by npm)
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          show-progress: false

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: lts/*

      - name: Verify SDK version matches tag
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          RUNTIME=$(grep 'export const SDK_VERSION = ' node/sdk/src/version.ts | sed 's/.*"\(.*\)".*/\1/')
          PKG=$(node -p "require('./node/sdk/package.json').version")
          [ "$RUNTIME" = "$VERSION" ] || { echo "::error::node/sdk/src/version.ts has $RUNTIME, tag is v$VERSION"; exit 1; }
          [ "$PKG" = "$VERSION" ]     || { echo "::error::node/sdk/package.json has $PKG, tag is v$VERSION"; exit 1; }
          echo "Node SDK runtime + package version $VERSION matches tag"

      - name: Build
        working-directory: node/sdk
        run: |
          npm ci
          npm run build

      - name: Publish
        working-directory: node/sdk
        run: npm publish --provenance --access public

  publish-node-starter:
    name: Publish Node Starter
    needs: [build-go, build-node, build-java, build-python, build-csharp]
    # Must use github-hosted runner: npm --provenance requires it (Blacksmith = "self-hosted", rejected by npm)
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          show-progress: false

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: lts/*

      - name: Verify Starter version matches tag
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          PKG=$(node -p "require('./node/starter/package.json').version")
          [ "$PKG" = "$VERSION" ] || { echo "::error::node/starter/package.json has $PKG, tag is v$VERSION"; exit 1; }
          echo "Node Starter version $PKG matches tag"

      - name: Build
        working-directory: node/starter
        run: |
          npm ci
          npm run build

      - name: Publish
        working-directory: node/starter
        run: npm publish --provenance --access public

  publish-python-sdk:
    name: Publish Python SDK
    needs: [build-go, build-node, build-java, build-python, build-csharp]
    runs-on: blacksmith-4vcpu-ubuntu-2404
    environment: pypi-sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          show-progress: false

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Verify SDK version matches tag
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          RUNTIME=$(grep '^__version__ = ' python/sdk/src/t0_provider_sdk/_version.py | sed 's/.*"\(.*\)".*/\1/')
          PKG=$(grep '^version = ' python/sdk/pyproject.toml | head -1 | sed 's/version = "\(.*\)"/\1/')
          [ "$RUNTIME" = "$VERSION" ] || { echo "::error::python/sdk/.../t0_provider_sdk/_version.py has $RUNTIME, tag is v$VERSION"; exit 1; }
          [ "$PKG" = "$VERSION" ]     || { echo "::error::python/sdk/pyproject.toml has $PKG, tag is v$VERSION"; exit 1; }
          echo "Python SDK runtime + package version $VERSION matches tag"

      - name: Build
        working-directory: python
        run: uv build --package t0-provider-sdk

      - name: Publish
        working-directory: python
        run: uv publish --trusted-publishing always dist/t0_provider_sdk-*

  publish-python-starter:
    name: Publish Python Starter
    needs: [build-go, build-node, build-java, build-python, build-csharp]
    runs-on: blacksmith-4vcpu-ubuntu-2404
    environment: pypi-starter
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          show-progress: false

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Verify Starter version matches tag
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          PKG=$(grep '^version = ' python/starter/pyproject.toml | head -1 | sed 's/version = "\(.*\)"/\1/')
          [ "$PKG" = "$VERSION" ] || { echo "::error::python/starter/pyproject.toml has $PKG, tag is v$VERSION"; exit 1; }
          echo "Python Starter version $PKG matches tag"

      - name: Build
        working-directory: python
        run: uv build --package t0-provider-starter

      - name: Publish
        working-directory: python
        run: uv publish --trusted-publishing always dist/t0_provider_starter-*

  publish-java:
    name: Publish Java
    needs: [build-go, build-node, build-java, build-python, build-csharp]
    # 2vcpu is sufficient — most time is spent polling Maven Central for deployment status
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - name: Generate GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.CI_APP_ID }}
          private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: provider-sdk

      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Get version from tag
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Verify SDK version matches tag
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          RUNTIME=$(grep '^sdk.version=' java/sdk/src/main/resources/META-INF/sdk-version.properties | cut -d= -f2)
          PKG=$(grep '^version=' java/gradle.properties | cut -d= -f2)
          [ "$RUNTIME" = "$VERSION" ] || { echo "::error::java/sdk/src/main/resources/META-INF/sdk-version.properties has $RUNTIME, tag is v$VERSION"; exit 1; }
          [ "$PKG" = "$VERSION" ]     || { echo "::error::java/gradle.properties has $PKG, tag is v$VERSION"; exit 1; }
          echo "Java SDK runtime + package version $VERSION matches tag"

      - name: Build
        working-directory: java
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon

      - name: Publish to Maven Central
        working-directory: java
        run: ./gradlew publishAggregationToCentralPortal --no-daemon
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          MAVEN_CENTRAL_USERNAME: ${{ vars.OSSRH_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.OSSRH_PASSWORD }}

      # Runs even if "Publish to Maven Central" failed — e.g. the version was already
      # published in a prior/duplicate deployment (Central rejects re-publishing an existing
      # version). The CLI jar must still reach the GitHub Release regardless. Uses the App
      # token, not GITHUB_TOKEN, which the releases API now rejects (same fix as release.yaml).
      - name: Upload provider-init.jar to GitHub Release
        if: ${{ !cancelled() }}
        working-directory: java
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          cp cli/build/libs/provider-init-${VERSION}.jar cli/build/libs/provider-init.jar
          gh release upload "v${VERSION}" cli/build/libs/provider-init.jar --clobber

  publish-csharp:
    name: Publish C# (NuGet)
    needs: [build-go, build-node, build-java, build-python, build-csharp]
    runs-on: blacksmith-4vcpu-ubuntu-2404
    environment: nuget
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          show-progress: false

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Verify SDK + Starter versions match tag
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          SDK_VER=$(grep '<Version>' csharp/sdk/T0.ProviderSdk/T0.ProviderSdk.csproj | sed 's/.*<Version>\(.*\)<\/Version>.*/\1/')
          STARTER_VER=$(grep '<Version>' csharp/starter/T0.ProviderStarter/T0.ProviderStarter.csproj | sed 's/.*<Version>\(.*\)<\/Version>.*/\1/')
          [ "$SDK_VER" = "$VERSION" ]     || { echo "::error::C# SDK csproj has $SDK_VER, tag is v$VERSION"; exit 1; }
          [ "$STARTER_VER" = "$VERSION" ] || { echo "::error::C# Starter csproj has $STARTER_VER, tag is v$VERSION"; exit 1; }
          echo "C# SDK + Starter versions $VERSION match tag"

      - name: Pack SDK
        working-directory: csharp
        run: dotnet pack sdk/T0.ProviderSdk/T0.ProviderSdk.csproj -c Release

      - name: Pack Starter
        working-directory: csharp
        run: dotnet pack starter/T0.ProviderStarter/T0.ProviderStarter.csproj -c Release

      - name: NuGet login (OIDC → temp API key)
        uses: NuGet/login@v1
        id: nuget-login
        with:
          user: stepan.romankov

      - name: Publish SDK to NuGet
        run: dotnet nuget push csharp/sdk/T0.ProviderSdk/bin/Release/*.nupkg --api-key ${{ steps.nuget-login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate

      - name: Publish Starter to NuGet
        run: dotnet nuget push csharp/starter/T0.ProviderStarter/bin/Release/*.nupkg --api-key ${{ steps.nuget-login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate

  # --- Post-publish ---
  verify-jitpack:
    name: Verify JitPack
    needs: [publish-java]
    # Only polls HTTP — minimal resources needed
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - name: Wait for JitPack availability
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          VERSION="${VERSION#v}"
          echo "Checking JitPack for version: $VERSION"
          MAX_ATTEMPTS=30
          DELAY=20
          URL="https://jitpack.io/com/github/t-0-network/provider-sdk/${VERSION}/provider-sdk-${VERSION}.pom"
          for i in $(seq 1 $MAX_ATTEMPTS); do
            echo "Attempt $i/$MAX_ATTEMPTS - checking $URL"
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" "$URL")
            if [ "$HTTP_CODE" = "200" ]; then
              echo "JitPack artifact verified!"
              exit 0
            fi
            echo "Not available yet (HTTP $HTTP_CODE), waiting ${DELAY}s..."
            sleep $DELAY
          done
          echo "Timeout waiting for JitPack"
          echo "Check: https://jitpack.io/#t-0-network/provider-sdk/${VERSION}"
          exit 1
