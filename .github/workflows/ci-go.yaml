name: CI / Go

on:
  push:
    branches: [master]
    paths:
      - "go/**"
      - "proto/**"
      - "cross_test/**"
      - ".github/tools/**"
      - ".github/workflows/ci-go.yaml"
  pull_request:
    branches: [master]
    paths:
      - "go/**"
      - "proto/**"
      - "cross_test/**"
      - ".github/tools/**"
      - ".github/workflows/ci-go.yaml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          show-progress: false

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: "stable"
          cache-dependency-path: |
            go/go.sum
            .github/tools/sumtool/go.sum

      - name: Test sumtool
        working-directory: .github/tools/sumtool
        run: go test -v ./...

      - name: Validate Go module state
        working-directory: go
        run: |
          go mod tidy
          git diff --exit-code || (echo "go.mod diff found, please run 'go mod tidy'" && false)

      - name: Run Tests
        working-directory: go
        run: go test -v ./...

      - name: Build starter template
        working-directory: go
        run: |
          VERSION=$(grep 'github.com/t-0-network/provider-sdk/go v' starter/template/go.mod | awk '{print $2}')
          PROXY_DIR="${RUNNER_TEMP}/goproxy"
          GOPROXY=direct go -C ../.github/tools/sumtool run . "${GITHUB_WORKSPACE}/go" "${VERSION}" "${PROXY_DIR}"
          cd starter/template
          # In PRs the SDK source may differ from the published tag, producing a
          # different module hash.  Drop the stale go.sum entries and re-tidy so
          # Go fetches the locally-built archive without a checksum conflict.
          sed -i '/^github.com\/t-0-network\/provider-sdk\/go /d' go.sum
          export GOMODCACHE="${RUNNER_TEMP}/template-modcache"
          export GOPROXY="file://${PROXY_DIR},direct"
          export GONOSUMDB="github.com/t-0-network"
          go mod tidy
          go build ./...
