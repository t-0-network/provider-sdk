name: CI / Go

on:
  push:
    branches: [master]
    paths:
      - "go/**"
      - "proto/**"
      - "cross_test/**"
      - ".github/tools/**"
      - ".github/workflows/ci-go.yaml"
  pull_request:
    branches: [master]
    paths:
      - "go/**"
      - "proto/**"
      - "cross_test/**"
      - ".github/tools/**"
      - ".github/workflows/ci-go.yaml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          show-progress: false

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: "stable"
          cache-dependency-path: |
            go/go.sum
            .github/tools/sumtool/go.sum

      - name: Test sumtool
        working-directory: .github/tools/sumtool
        run: go test -v ./...

      - name: Validate Go module state
        working-directory: go
        run: |
          go mod tidy
          git diff --exit-code || (echo "go.mod diff found, please run 'go mod tidy'" && false)

      - name: Run Tests
        working-directory: go
        run: go test -v ./...

      - name: Build starter template
        working-directory: go
        run: |
          go work init . ./starter ./starter/template
          cd starter/template && go build ./...
          cd ../.. && rm -f go.work go.work.sum
