name: Test Node SDK
description: Build and test the Node.js SDK including cross-language server-to-server tests

inputs:
  lockfile:
    description: >-
      "false" deletes package-lock.json and installs the newest release in every
      range, as a customer's `npm install @t-0/provider-sdk` does.
    default: "true"

runs:
  using: composite
  steps:
    - name: Setup Node
      uses: actions/setup-node@v7
      with:
        node-version: lts/*
        # No cache without the lockfile: the lockfile is its key.
        cache: ${{ inputs.lockfile == 'true' && 'npm' || '' }}
        cache-dependency-path: node/sdk/package-lock.json

    - uses: ./.github/actions/setup-go-helper

    - name: Install dependencies
      if: inputs.lockfile == 'true'
      shell: bash
      working-directory: node/sdk
      run: npm ci

    - name: Install latest dependencies without the lockfile
      if: inputs.lockfile != 'true'
      shell: bash
      working-directory: node/sdk
      run: |
        rm package-lock.json
        npm install --no-audit --no-fund

    - name: Show resolved versions
      if: inputs.lockfile != 'true'
      shell: bash
      working-directory: node/sdk
      run: npm ls --omit=dev --all

    - uses: ./.github/actions/buf-generate

    - name: Build
      shell: bash
      working-directory: node/sdk
      run: npm run build

    - name: Test
      shell: bash
      working-directory: node/sdk
      run: npm test
