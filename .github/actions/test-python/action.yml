name: Test Python SDK
description: Build and test the Python SDK including cross-language server-to-server tests

runs:
  using: composite
  steps:
    - name: Setup Python
      uses: actions/setup-python@v7
      with:
        python-version: "3.13"

    - name: Install uv
      uses: astral-sh/setup-uv@v10.3.3
      with:
        enable-cache: true
        cache-dependency-glob: python/uv.lock
        # setup-uv v9 stopped pruning the cache by default; keep pruning it.
        prune-cache: true

    - uses: ./.github/actions/setup-go-helper

    - uses: ./.github/actions/buf-generate

    - name: Install dependencies
      shell: bash
      working-directory: python
      run: uv sync --locked --all-packages

    - name: Build packages
      shell: bash
      working-directory: python
      run: |
        uv build --package t0-provider-sdk

    - name: Test
      shell: bash
      working-directory: python
      run: uv run pytest
