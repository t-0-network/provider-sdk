[project]
name = "my-provider"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "t0-provider-sdk>=1.2.0",
    "uvicorn>=0.44.0",
    "python-dotenv>=1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/provider"]
